[package]
name = "rime-wanxiang-slim-installer"
version = "1.3.2"
authors = ["Fidel Yin"]
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
base16ct = { version = "1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
colored = "3"
digest-io = "0.1"
httpdate = "1"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
octocrab = "0.54"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
saphyr = { version = "0.3", default-features = false }
semver = "1"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
termimad = "0.35"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
restart-manager = "0.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "debuginfo"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
similar_names = "allow"
